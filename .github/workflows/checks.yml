name: Build and offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned Python dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Test Python engine without model downloads
        working-directory: backend
        env:
          HF_HUB_OFFLINE: '1'
        run: python -m pytest -q
      - name: Check browser scripts
        run: |
          node --check backend/brain/web/studio.js
          node --check extensions/chrome/extract.js
          node --check extensions/chrome/popup.js
      - name: Build native app
        run: sh scripts/build-app.sh
      - name: Check native memory transfer and legacy decoding
        run: .build/release/MemoryChecks
      - name: Check research metrics
        run: python3 -m unittest discover -s research/evaluation -p 'test_*.py'
