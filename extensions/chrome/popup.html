<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Second Brain article capture</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head><body><h1>Review this article</h1><p>Only the tab you explicitly choose is read. Nothing is saved automatically.</p><button id="capture">Read selected tab</button><p id="status" role="status"></p><section id="preview" hidden><label>Title<input id="title"></label><label>Source<input id="source" readonly></label><label>Article text<textarea id="text" rows="12"></textarea></label><p id="details"></p><button id="download">Export reviewed article</button><p>In Learning Studio → Library, choose “Import browser article file”, review it, then save. The exported file may contain private text; keep it local.</p></section></body></html>
